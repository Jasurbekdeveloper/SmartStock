<div class="max-w-2xl mx-auto">
  <h1 class="text-3xl font-bold mb-8 text-gray-900 dark:text-white">{{ 'debts.addDebt' | translate }}</h1>

  <form (ngSubmit)="submit()" class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6 space-y-6">
    <div>
      <label class="block text-gray-700 dark:text-gray-300 font-medium mb-2">{{ 'debts.customer' | translate }}</label>
      <div class="grid grid-cols-2 gap-2 mb-4">
        <button
          type="button"
          (click)="isNewCustomer.set(true)"
          [class.border-blue-500]="isNewCustomer()"
          [class.bg-blue-50]="isNewCustomer()"
          [class.dark:bg-blue-900]="isNewCustomer()"
          [class.border-gray-300]="!isNewCustomer()"
          [class.dark:border-gray-600]="!isNewCustomer()"
          class="px-3 py-2 border-2 rounded-lg text-gray-900 dark:text-white font-medium transition"
        >
          {{ 'debts.newCustomer' | translate }}
        </button>
        <button
          type="button"
          (click)="isNewCustomer.set(false)"
          [class.border-blue-500]="!isNewCustomer()"
          [class.bg-blue-50]="!isNewCustomer()"
          [class.dark:bg-blue-900]="!isNewCustomer()"
          [class.border-gray-300]="isNewCustomer()"
          [class.dark:border-gray-600]="isNewCustomer()"
          class="px-3 py-2 border-2 rounded-lg text-gray-900 dark:text-white font-medium transition"
        >
          {{ 'debts.existingCustomer' | translate }}
        </button>
      </div>

      @if (isNewCustomer()) {
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-gray-700 dark:text-gray-300 text-sm mb-1">{{ 'debts.customerName' | translate }}</label>
          <input
            type="text"
            [(ngModel)]="customerName"
            name="customerName"
            class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:border-blue-500"
          />
        </div>
        <div>
          <label class="block text-gray-700 dark:text-gray-300 text-sm mb-1">{{ 'debts.customerPhone' | translate }}</label>
          <input
            type="text"
            [(ngModel)]="customerPhone"
            name="customerPhone"
            placeholder="+998 90 123 45 67"
            class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:border-blue-500"
          />
        </div>
        <div class="md:col-span-2">
          <label class="block text-gray-700 dark:text-gray-300 text-sm mb-1">{{ 'debts.customerAddress' | translate }}</label>
          <input
            type="text"
            [(ngModel)]="customerAddress"
            name="customerAddress"
            class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:border-blue-500"
          />
        </div>
      </div>
      } @else {
      <select
        [(ngModel)]="selectedCustomerId"
        name="selectedCustomerId"
        class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:border-blue-500"
      >
        <option value="" disabled>{{ 'debts.selectCustomer' | translate }}</option>
        @for (customer of customers(); track customer.id) {
        <option [value]="customer.id">{{ customer.name }} — {{ customer.phone }}</option>
        }
      </select>
      }
    </div>

    <div>
      <label class="block text-gray-700 dark:text-gray-300 font-medium mb-2">{{ 'debts.totalAmount' | translate }}</label>
      <input
        type="number"
        [(ngModel)]="totalAmount"
        name="totalAmount"
        step="0.01"
        min="0"
        class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:border-blue-500"
        placeholder="0.00"
      />
    </div>

    <div>
      <label class="block text-gray-700 dark:text-gray-300 font-medium mb-2">{{ 'debts.notes' | translate }}</label>
      <textarea
        [(ngModel)]="notes"
        name="notes"
        rows="3"
        class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:border-blue-500"
      ></textarea>
    </div>

    @if (errorKey(); as key) {
    <div class="p-3 bg-red-100 dark:bg-red-900 text-red-700 dark:text-red-300 rounded-lg">
      {{ key | translate }}
    </div>
    }

    <div class="flex gap-4">
      <button
        type="submit"
        [disabled]="submitting()"
        class="bg-blue-600 dark:bg-blue-800 text-white px-6 py-2 rounded-lg hover:bg-blue-700 dark:hover:bg-blue-900 transition disabled:bg-gray-400 dark:disabled:bg-gray-600"
      >
        {{ 'debts.addDebt' | translate }}
      </button>
      <a routerLink="/debts/list" class="bg-gray-400 dark:bg-gray-600 text-white px-6 py-2 rounded-lg hover:bg-gray-500 dark:hover:bg-gray-700 transition inline-block">
        {{ 'common.cancel' | translate }}
      </a>
    </div>
  </form>
</div>
