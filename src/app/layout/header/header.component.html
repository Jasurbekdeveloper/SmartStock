<mat-toolbar color="primary" class="shadow-lg gap-2">
  <button mat-icon-button class="lg:!hidden" (click)="sidebarState.toggleMobile()" aria-label="Menu">
    <mat-icon>{{ sidebarState.mobileOpen() ? 'close' : 'menu' }}</mat-icon>
  </button>

  <a routerLink="/dashboard" (click)="sidebarState.closeMobile()" class="flex items-center gap-2 text-inherit no-underline min-w-0">
    <img src="/logo.svg" alt="SmartStock" class="w-7 h-7 sm:w-8 sm:h-8 shrink-0" />
    <span class="text-xl sm:text-2xl font-bold truncate">SmartStock</span>
  </a>

  <span class="flex-1"></span>

  <!-- Language Selector: icon-only on narrow screens, name shown from sm up.
       mat-button's own CSS sets display, so the responsive hide/show must be !important
       or Tailwind's utility loses the cascade to Material's component styles. -->
  <button mat-icon-button [matMenuTriggerFor]="langMenu" class="sm:!hidden" aria-label="Language">
    <mat-icon>language</mat-icon>
  </button>
  <button mat-button [matMenuTriggerFor]="langMenu" class="!hidden sm:!inline-flex whitespace-nowrap">
    <mat-icon>language</mat-icon>
    {{ currentLanguageName() }}
  </button>
  <mat-menu #langMenu="matMenu">
    @for (lang of languages; track lang.code) {
    <button mat-menu-item (click)="setLanguage(lang.code)">{{ lang.name }}</button>
    }
  </mat-menu>

  <!-- Theme Switcher -->
  <button
    mat-icon-button
    (click)="toggleTheme()"
    [title]="themeService.getTheme() === 'light' ? 'Switch to Dark Mode' : 'Switch to Light Mode'"
  >
    <mat-icon>{{ themeService.getTheme() === 'light' ? 'dark_mode' : 'light_mode' }}</mat-icon>
  </button>

  <!-- User Menu -->
  <span class="text-sm hidden sm:inline">{{ userName() }}</span>
  <button mat-icon-button [matMenuTriggerFor]="userMenu">
    <mat-icon>more_vert</mat-icon>
  </button>
  <mat-menu #userMenu="matMenu">
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      {{ translationService.t('common.logout') }}
    </button>
  </mat-menu>
</mat-toolbar>
