<header class="topbar">
  <button mat-icon-button class="lg:!hidden" (click)="sidebarState.toggleMobile()" aria-label="Menu">
    <mat-icon>{{ sidebarState.mobileOpen() ? 'close' : 'menu' }}</mat-icon>
  </button>

  <a routerLink="/dashboard" (click)="sidebarState.closeMobile()" class="flex lg:hidden items-center gap-2 min-w-0">
    <img src="/logo.svg" alt="" class="w-8 h-8 shrink-0" />
    <span class="font-bold truncate">{{ storeName() }}</span>
  </a>

  <div class="hidden lg:block text-sm text-gray-500 dark:text-gray-400">{{ today | date: 'EEEE, d MMMM' }}</div>

  <span class="flex-1"></span>

  <button mat-button [matMenuTriggerFor]="langMenu" class="!min-w-0" aria-label="Language">
    <mat-icon>translate</mat-icon>
    <span class="hidden sm:inline">{{ currentLanguageShort() }}</span>
  </button>
  <mat-menu #langMenu="matMenu">
    @for (lang of languages; track lang.code) {
    <button mat-menu-item (click)="setLanguage(lang.code)">{{ lang.name }}</button>
    }
  </mat-menu>

  <button mat-icon-button (click)="toggleTheme()" [attr.aria-label]="'common.theme' | translate">
    <mat-icon>{{ themeService.getTheme() === 'light' ? 'dark_mode' : 'light_mode' }}</mat-icon>
  </button>

  <button type="button" class="topbar__user" [matMenuTriggerFor]="userMenu">
    <span class="topbar__avatar">{{ initials() }}</span>
    <span class="hidden sm:flex flex-col items-start leading-tight">
      <span class="text-sm font-semibold">{{ userName() }}</span>
      <span class="text-[11px] text-gray-500 dark:text-gray-400">{{ roleKey() | translate }}</span>
    </span>
    <mat-icon class="text-gray-400">expand_more</mat-icon>
  </button>
  <mat-menu #userMenu="matMenu" xPosition="before">
    @if (isAdmin()) {
    <a mat-menu-item routerLink="/settings/subscription">
      <mat-icon>workspace_premium</mat-icon>
      {{ 'subscription.title' | translate }}
    </a>
    }
    <button mat-menu-item (click)="openTelegram()">
      <mat-icon>send</mat-icon>
      {{ 'telegram.menuItem' | translate }}
    </button>
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      {{ 'common.logout' | translate }}
    </button>
  </mat-menu>
</header>
