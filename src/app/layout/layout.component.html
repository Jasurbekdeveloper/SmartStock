<mat-sidenav-container class="h-screen !bg-transparent" (backdropClick)="sidebarState.closeMobile()">
  <mat-sidenav
    [mode]="overlayMenu() ? 'over' : 'side'"
    [opened]="overlayMenu() ? sidebarState.mobileOpen() : true"
    (closedStart)="sidebarState.closeMobile()"
    class="!w-[264px] !border-0 !rounded-none !bg-transparent"
  >
    <app-sidebar></app-sidebar>
  </mat-sidenav>

  <mat-sidenav-content class="!bg-transparent">
    @if (!focusMode()) {
    <app-header></app-header>
    <app-subscription-banner></app-subscription-banner>
    }
    <main [class]="focusMode() ? 'pos-main' : 'p-4 lg:p-6 min-h-[calc(100%-4rem)]'">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
