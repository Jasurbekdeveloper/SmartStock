<div class="max-w-2xl mx-auto">
  <h1 class="page-title mb-6">{{ 'stock.stockOut' | translate }}</h1>

  <mat-card class="!p-6">
    <form (ngSubmit)="removeStock()" class="space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="md:col-span-2">
        <p class="text-sm font-medium mb-2 text-muted">{{ 'stock.product' | translate }}</p>
        <app-product-picker [products]="products()" [selected]="selectedProduct()" (picked)="onPick($event)" />
      </div>

      <mat-form-field appearance="outline">
        <mat-label>{{ 'stock.quantity' | translate }}</mat-label>
        <input #qtyInput matInput type="number" [(ngModel)]="quantity" name="quantity" min="0.01" step="0.01" [max]="selectedProduct()?.quantity ?? null" placeholder="0" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>{{ 'stock.reason' | translate }}</mat-label>
        <mat-select [(ngModel)]="reason" name="reason">
          @for (r of reasons; track r) {
          <mat-option [value]="r">{{ reasonLabelKey(r) | translate }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>{{ 'stock.notes' | translate }}</mat-label>
      <textarea matInput [(ngModel)]="notes" name="notes" rows="3"></textarea>
    </mat-form-field>

    @if (errorKey(); as key) {
    <div class="p-3 bg-red-100 dark:bg-red-900 text-red-700 dark:text-red-300 rounded-lg">
      {{ key | translate }}
    </div>
    }

    <button mat-flat-button color="warn" type="submit" [disabled]="submitting()" class="w-full !py-3">
      {{ 'stock.stockOut' | translate }}
    </button>
    </form>
  </mat-card>
</div>
